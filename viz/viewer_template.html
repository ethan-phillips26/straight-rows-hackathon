<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Straight Rows Replay</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0b1117; --panel:#111a22; --raise:#17222c; --line:#223140; --line2:#2f4254;
    --text:#e9eff5; --mute:#97a8b8; --faint:#7f94a6;
    --t1:#4cc2ff; --t2:#ffb454; --t3:#b4e06a;
    --SPACE_WEATHER:#c792ea; --JAMMING:#ff6b6b; --SPOOFING:#ff9f43; --EQUIPMENT_FAULT:#f7d154; --MULTIPATH:#6ee7c8;
    --accent:#e9eff5;
    --ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    --data:"JetBrains Mono","IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  ::selection{background:color-mix(in srgb,var(--accent) 40%,transparent);color:#fff}
  html{scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px} ::-webkit-scrollbar-track{background:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--ui);height:100vh;display:flex;flex-direction:column;
       font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
  button,select,label.file,input{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* header */
  header{display:flex;gap:20px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg)}
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand b{font-size:17px;font-weight:650;letter-spacing:-.01em}
  .brand span{color:var(--mute);font-size:13px}
  .tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .tab{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);color:var(--mute);padding:6px 12px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--raise);color:var(--text)}
  .tab .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .tab .nm{font-family:var(--data);font-size:13px;color:var(--text)}
  .tab .cl{font-size:13px;text-transform:lowercase}
  .tab.on{background:var(--raise);border-color:var(--line2);color:var(--text)}
  label.file{color:var(--faint);font-size:13px;cursor:pointer;padding:6px 10px;border-radius:8px;border:1px solid transparent}
  label.file:hover{color:var(--mute);border-color:var(--line)}

  /* layout */
  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,40%) 1fr;gap:14px;padding:14px 20px 18px}
  .col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:0}
  .phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px}
  .phead h2{margin:0;font-size:14px;font-weight:600;letter-spacing:0}
  .phead .sub{color:var(--mute);font-size:12.5px;font-weight:400;margin-left:8px}
  canvas{width:100%;display:block}

  /* field */
  #fieldwrap{flex:1.25;display:flex;flex-direction:column}
  #fieldbody{flex:1;min-height:0;display:flex;gap:14px}
  #field{flex:1;min-width:0;height:100%}
  #clock{font-family:var(--data);font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px}
  #clock .live{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  #clock.on .live{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  #tcol{flex:0 0 188px;display:flex;flex-direction:column;justify-content:center;gap:10px}
  #tstat{display:flex;flex-direction:column;gap:10px}
  .foot{margin:0;color:var(--faint);font-size:12px;line-height:1.4}
  .tr{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"id fix" "cn0 cn0" "sv xte";gap:2px 10px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-family:var(--data);font-size:12.5px;color:var(--mute)}
  .tr>:nth-child(1){grid-area:id} .tr>:nth-child(2){grid-area:cn0;color:var(--text);font-size:14px} .tr>:nth-child(3){grid-area:sv} .tr>:nth-child(4){grid-area:xte;text-align:right} .tr>:nth-child(5){grid-area:fix;text-align:right;font-size:11.5px}
  .tr.hit{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--text)}
  .tr b{font-family:var(--ui);font-weight:650;font-size:13px}
    .tr .warn{color:#ff8f8f}
  .chip{display:inline-block;padding:0 7px;border-radius:5px;font-family:var(--ui);font-size:12px;font-weight:600;background:#ff5d5d22;color:#ff8f8f;margin-left:6px}

  /* card */
  #card{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}
  #card>*{flex-shrink:0}
  #card.fresh>*{animation:rise .42s var(--ease) both} #card.fresh>*:nth-child(2){animation-delay:.04s} #card.fresh>*:nth-child(3){animation-delay:.08s}
  #card.fresh>*:nth-child(4){animation-delay:.12s} #card.fresh>*:nth-child(5){animation-delay:.16s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .ctop{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cls{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.015em;color:var(--accent)}
  .cls i{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
  .cid{font-family:var(--data);font-size:13px;color:var(--mute)}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:13.5px}
  .tch{font-family:var(--data);font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
  .when{font-family:var(--data);color:var(--text)}
  .action{border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding:10px 14px}
  .lbl{display:block;color:var(--mute);font-size:12.5px;margin-bottom:2px}
  .action b{font-size:16px;font-weight:650;letter-spacing:.01em}
  .conf{display:flex;align-items:center;gap:14px}
  .conf .lbl{margin:0;min-width:86px}
  .bar{flex:1;max-width:240px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transform-origin:left;animation:grow .7s var(--ease) both}
  @keyframes grow{from{transform:scaleX(0)}}
  .pct{font-family:var(--data);font-size:15px;font-weight:600}
  .evid{min-height:0}
  .evid ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px}
  .evid li{font-size:13.5px;line-height:1.5;color:var(--text);padding-top:8px;border-top:1px solid var(--line);max-width:68ch}
  .evid li:first-child{border-top:0;padding-top:0}
  .space{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;color:var(--mute);font-size:13px;padding-top:10px;border-top:1px solid var(--line)}
  .space .v{font-family:var(--data);color:var(--text)}
  .dim{color:var(--mute)}

  /* transport */
  .transport{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 16px}
  button.play{display:flex;align-items:center;gap:8px;background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:7px 16px 7px 12px;font-weight:650;cursor:pointer;min-width:98px;transition:transform .12s}
  button.play:active{transform:scale(.97)} button.play svg{width:16px;height:16px;fill:currentColor}
  input[type=range]{flex:1;min-width:160px;-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)} input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 4px #0008}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  select{background:var(--raise);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;cursor:pointer}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;color:var(--mute);border:0;padding:6px 12px;cursor:pointer;font-size:13.5px;transition:background .15s,color .15s}
  .seg button:hover{color:var(--text)} .seg button.on{background:var(--raise);color:var(--text);font-weight:600}
  .seg button+button{border-left:1px solid var(--line2)}
  .keys{color:var(--faint);font-size:12px;width:100%;margin-top:-2px}
  kbd{font-family:var(--data);font-size:11.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--mute);background:var(--raise)}

  /* charts */
  #charts{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 16px 12px}
  .ch{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px}
  .ch:first-child{border-top:0;padding-top:0}
  .ch-head{display:flex;align-items:baseline;gap:12px;font-size:13px;white-space:nowrap}
  .ch-head h3{margin:0;font-size:13.5px;font-weight:600}
  .ch-head .note{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .ch-head .vals{margin-left:auto;display:flex;gap:14px;font-family:var(--data);font-size:12.5px}
  .ch canvas{flex:1;min-height:0;cursor:ew-resize;touch-action:none}

  @media (max-width:900px){
    body{height:auto} header{flex-wrap:wrap} main{grid-template-columns:1fr} #fieldwrap,#card{flex:none} #fieldbody{flex-direction:column;height:auto} #field{height:300px;flex:none}
    #tcol{flex:none} #tstat{flex-direction:row;flex-wrap:wrap} .tr{flex:1 1 170px} #charts .ch{min-height:170px;flex:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Straight Rows</b><span>detection replay</span></div>
  <div class="tabs" id="tabs"></div>
  <label class="file">Load bundle .json<input id="file" type="file" accept=".json" hidden></label>
</header>
<main>
  <div class="col">
    <div class="panel" id="fieldwrap">
      <div class="phead"><h2>Field, top-down <span class="sub">reported position</span></h2><span id="clock"><i class="live"></i><span id="clocktxt"></span></span></div>
      <div id="fieldbody"><canvas id="field"></canvas><div id="tcol"><div id="tstat"></div><p class="foot">Marker ring grows with |XTE|; dashed red above 1 m.</p></div></div>
    </div>
    <div class="panel" id="card"></div>
  </div>
  <div class="col">
    <div class="panel transport">
      <button class="play" id="play"></button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position">
      <select id="speed" aria-label="Playback speed">
        <option value="10">10×</option><option value="30" selected>30×</option>
        <option value="60">60×</option><option value="120">120×</option><option value="300">300×</option>
      </select>
      <div class="seg" id="mode" role="group" aria-label="Chart mode">
        <button data-m="raw" class="on" title="Signals as measured">Raw</button>
        <button data-m="own" title="Signal minus that tractor's own quiet median">vs own baseline</button>
        <button data-m="fleet" title="Signal minus the fleet median at the same second">vs fleet</button>
      </div>
      <div class="keys"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> ±30 s · <kbd>R</kbd> residual · <kbd>1</kbd>–<kbd>9</kbd> episode · drag a chart to scrub</div>
    </div>
    <div class="panel" id="charts"></div>
  </div>
</main>

<script>
const BUNDLE = /*__BUNDLE__*/null;
const TCOL = {T1:'#4cc2ff', T2:'#ffb454', T3:'#b4e06a'};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FIX = ['NO FIX','AUTONOMOUS','DGPS','RTK FLOAT','RTK FIXED'];
const FONT = '"IBM Plex Sans","Segoe UI",system-ui,sans-serif';
const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>Play';
const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zm6 0h3v11h-3z"/></svg>Pause';
const ICON_AGAIN = '<svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 0 5.5 5.5h-2A3.5 3.5 0 1 1 8 4.5V7l4-3.5L8 0z" transform="translate(0 1)"/></svg>Replay';

// Chart definitions. key = field in telemetry; res = base name of the residual fields; sig = key in bundle.sigma
const CHARTS = [
  {title:'Mean C/N0', note:'dB-Hz', key:'cn0', res:'r_cn0', sig:'mean_cn0_dbhz', dp:1},
  {title:'Cross-track error', note:'|XTE|, m', key:'xte', res:'r_xte', sig:'axte', abs:true, dp:2},
  {title:'Position offset vs XTE', note:'solid: lon offset · dashed: signed XTE', key:'londev', overlay:'xte', rawOnly:true, dp:2},
  {title:'Satellites tracked', note:'count', key:'sats', res:'r_sats', sig:'num_sats', dp:0},
  {title:'S4 scintillation', note:'fleet-wide, space-side · ticks: advisories and RFI reports', key:null},
];

let B = BUNDLE, clip = null, t = 0, playing = true, mode = 'raw', last = 0;
const $ = id => document.getElementById(id);
const fieldC = $('field');
let chartEls = [];

function init(){
  if(!B){ document.body.innerHTML = '<p style="padding:20px">No data. Run scripts/make_viz.py or load a bundle .json.</p>' +
    '<label class="file" style="margin:20px">Load bundle<input id="file" type="file" accept=".json" hidden></label>'; wireFile(); return; }
  $('tabs').innerHTML = '';
  B.clips.forEach((c,i)=>{
    const b = document.createElement('button'); b.className='tab';
    b.innerHTML = `<span class="dot" style="background:${css('--'+c.cls)}"></span><span class="nm">${c.id}</span><span class="cl">${c.cls.replace('_',' ')}</span>`;
    b.onclick = ()=>select(i); $('tabs').appendChild(b);
  });
  $('charts').innerHTML = '';
  chartEls = CHARTS.map(def=>{
    const d = document.createElement('div'); d.className='ch';
    d.innerHTML = `<div class="ch-head"><h3>${def.title}</h3><span class="note"></span><span class="vals"></span></div><canvas></canvas>`;
    $('charts').appendChild(d);
    const cv = d.querySelector('canvas');
    const at = e => { const r = cv.getBoundingClientRect(); seekFrac((e.clientX - r.left - PADL) / (r.width - PADL - PADR)); };
    cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); playing=false; $('play').innerHTML = ICON_PLAY; at(e); cv._drag = true; };
    cv.onpointermove = e => { if(cv._drag) at(e); };
    cv.onpointerup = () => { cv._drag = false; };
    return {def, cv, note:d.querySelector('.note'), vals:d.querySelector('.vals')};
  });
  // deep link: #c=<clip index>&t=<seconds>&play=0 (handy for screenshots and rehearsal)
  const h = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(p=>p.split('=')));
  select(Math.min(B.clips.length-1, +h.c || 0));
  if(h.t) t = Math.max(0, Math.min(clip.len, +h.t));
  if(h.play==='0'){ playing = false; $('play').innerHTML = ICON_PLAY; }
}

function select(i){
  clip = B.clips[i]; t = 0; playing = true; $('play').innerHTML = ICON_PAUSE;
  [...$('tabs').children].forEach((b,j)=>b.classList.toggle('on', i===j));
  document.documentElement.style.setProperty('--accent', css('--'+clip.cls));
  clip.len = (clip.n - 1) * clip.step;
  computeBounds(); computeTicks(); renderCard(); renderTractorRows();
}

function seekFrac(f){ t = Math.max(0, Math.min(1, f)) * clip.len; }

function computeBounds(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const id in clip.trk){ const k=clip.trk[id]; for(let i=0;i<k.x.length;i++){ x0=Math.min(x0,k.x[i]); x1=Math.max(x1,k.x[i]); y0=Math.min(y0,k.y[i]); y1=Math.max(y1,k.y[i]); } }
  const m = 20; clip.bounds = {x0:x0-m,x1:x1+m,y0:y0-m,y1:y1+m};
}
// time-axis ticks at round wall-clock minutes, about 6-8 across the clip
function computeTicks(){
  const t0 = new Date(clip.t0).getTime()/1000, steps = [300,600,900,1200,1800,3600,7200];
  const stepS = steps.find(s => clip.len/s <= 8) || 7200, first = Math.ceil(t0/stepS)*stepS - t0;
  clip.ticks = []; for(let s=first; s<=clip.len; s+=stepS) clip.ticks.push(s);
}

function fit(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  const w = Math.round(r.width*dpr), h = Math.round(r.height*dpr);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w:r.width, h:r.height};
}

const idxNow = () => Math.min(clip.n-1, Math.floor(t / clip.step));
const inEvent = () => t >= clip.ev_start && t <= clip.ev_end;

// ---------- field ----------
function drawField(){
  const {ctx,w,h} = fit(fieldC); ctx.clearRect(0,0,w,h);
  const b = clip.bounds, bw = b.x1-b.x0, bh = b.y1-b.y0;
  const s = Math.min((w-16)/bw, (h-44)/bh), ox = (w - bw*s)/2, oy = 26 + (h-44 - bh*s)/2;
  const X = x => ox + (x-b.x0)*s, Y = y => h - (oy + (y-b.y0)*s);
  const i = idxNow(), cls = css('--'+clip.cls), live = inEvent();
  // 50 m reference grid
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 1; ctx.beginPath();
  for(let gx=Math.ceil(b.x0/50)*50; gx<=b.x1; gx+=50){ ctx.moveTo(X(gx),Y(b.y0)); ctx.lineTo(X(gx),Y(b.y1)); }
  for(let gy=Math.ceil(b.y0/50)*50; gy<=b.y1; gy+=50){ ctx.moveTo(X(b.x0),Y(gy)); ctx.lineTo(X(b.x1),Y(gy)); }
  ctx.globalAlpha = .55; ctx.stroke(); ctx.globalAlpha = 1;
  for(const id in clip.trk){
    const k = clip.trk[id], col = TCOL[id];
    ctx.strokeStyle = col+'26'; ctx.beginPath();
    for(let j=0;j<k.x.length;j+=Math.max(1,Math.floor(30/clip.step))) j?ctx.lineTo(X(k.x[j]),Y(k.y[j])):ctx.moveTo(X(k.x[j]),Y(k.y[j]));
    ctx.stroke();
    const from = Math.max(0, i - Math.ceil(240/clip.step));
    ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath();
    for(let j=from;j<=i;j++) j===from?ctx.moveTo(X(k.x[j]),Y(k.y[j])):ctx.lineTo(X(k.x[j]),Y(k.y[j]));
    ctx.stroke(); ctx.lineWidth = 1;
    // marker: ring radius grows with |xte| (1 m = +10 px); flagged tractors get a class-colored halo
    const px = X(k.x[i]), py = Y(k.y[i]), xte = Math.abs(k.xte[i] ?? 0), flagged = live && clip.tractors.includes(id);
    if(flagged){ ctx.fillStyle = cls+'30'; ctx.beginPath(); ctx.arc(px,py,16+xte*10,0,7); ctx.fill(); }
    ctx.strokeStyle = xte>1 ? '#ff6b6b' : col; ctx.lineWidth = 1.5; ctx.setLineDash(xte>1?[4,3]:[]);
    ctx.beginPath(); ctx.arc(px,py,8+xte*10,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = flagged ? cls : col; ctx.beginPath(); ctx.arc(px,py,5.5,0,7); ctx.fill();
    ctx.font = `600 12px ${FONT}`; ctx.lineWidth = 3; ctx.strokeStyle = css('--panel'); ctx.strokeText(id, px+12, py-9);
    ctx.fillStyle = col; ctx.fillText(id, px+12, py-9); ctx.lineWidth = 1;
  }
  ctx.font = `12px ${FONT}`; ctx.fillStyle = css('--mute'); ctx.fillText('N ↑', 6, 14);
  const L = 100; ctx.fillStyle = css('--mute'); ctx.fillRect(8, h-14, L*s, 2); ctx.fillText('100 m', 8, h-20);
  
}

function renderTractorRows(){
  $('tstat').innerHTML = Object.keys(clip.trk).map(id =>
    `<div class="tr" id="tr-${id}"><b style="color:${TCOL[id]}">${id}</b><span></span><span></span><span></span><span></span></div>`).join('');
}
function updateTractorRows(){
  const i = idxNow(), live = inEvent();
  for(const id in clip.trk){
    const k = clip.trk[id], row = $('tr-'+id); if(!row) continue;
    const sp = row.children;
    row.classList.toggle('hit', live && clip.tractors.includes(id));
    sp[1].textContent = `${k.cn0[i]==null?'–':k.cn0[i].toFixed(1)} dB-Hz`;
    sp[2].textContent = `${k.sats[i]} sv`;
    sp[3].textContent = `XTE ${(k.xte[i] ?? 0).toFixed(2)} m`;
    sp[4].innerHTML = FIX[k.fix[i]] + (k.link[i] ? '' : '<span class="chip">BASE LINK LOST</span>');
    sp[4].className = k.fix[i] < 4 ? 'warn' : '';
  }
}

// ---------- charts ----------
const PADL = 42, PADR = 8;
function series(def, id){
  const k = clip.trk[id];
  if(mode==='raw' || def.rawOnly) return def.abs ? k[def.key].map(v=>v==null?null:Math.abs(v)) : k[def.key];
  return k[`${def.res}_${mode}`];
}
const hm = sec => fmt(sec).slice(0,5);
function drawCharts(){
  const i = idxNow(), last = chartEls.length-1;
  chartEls.forEach(({def, cv, note, vals}, ci)=>{
    const {ctx,w,h} = fit(cv); ctx.clearRect(0,0,w,h);
    const axisH = ci===last ? 16 : 0, pw = w-PADL-PADR, ph = h-8-axisH, X = tt => PADL + tt/clip.len*pw;
    let lines = [], band = null, sub = def.note;
    if(def.key){
      for(const id in clip.trk) lines.push({id, v: series(def,id), col:TCOL[id]});
      if(mode!=='raw' && !def.rawOnly){ const sg = B.sigma; const s = Math.max(...Object.keys(sg).map(t=>sg[t][def.sig])); band = 3*s;
        sub = `residual ${mode==='own'?'vs own baseline':'vs fleet median'} · shaded ±3σ`; }
    }
    if(note.textContent !== sub) note.textContent = sub;
    // y range
    let lo=1e9, hi=-1e9;
    if(def.key){ for(const l of lines) for(const v of l.v) if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}
      if(def.overlay) for(const id in clip.trk) for(const v of clip.trk[id][def.overlay]) if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}
      if(band){lo=Math.min(lo,-band);hi=Math.max(hi,band);} }
    else { for(const [,v] of clip.s4){lo=Math.min(lo,v);hi=Math.max(hi,v);} lo=0; hi=Math.max(hi,0.5); }
    const pad = (hi-lo)*0.08||1; hi+=pad; lo = (def.key && mode==='raw' && !def.rawOnly && lo>=0) ? Math.max(0, lo-pad) : lo-pad;
    const Y = v => 4 + (1-(v-lo)/(hi-lo))*ph;
    // event window
    const col = css('--'+clip.cls);
    ctx.fillStyle = col+'1f'; ctx.fillRect(X(clip.ev_start), 0, X(clip.ev_end)-X(clip.ev_start), ph+4);
    ctx.fillStyle = col+'99'; ctx.fillRect(X(clip.ev_start), 0, 1.5, ph+4); ctx.fillRect(X(clip.ev_end)-1, 0, 1.5, ph+4);
    // grid + axes
    ctx.strokeStyle = css('--line'); ctx.fillStyle = css('--mute'); ctx.font=`11px ${FONT}`; ctx.lineWidth=1;
    for(let g=0; g<=3; g++){ const v = lo+(hi-lo)*g/3, y=Y(v); ctx.beginPath(); ctx.moveTo(PADL,y); ctx.lineTo(w-PADR,y); ctx.stroke(); ctx.textAlign='right'; ctx.fillText(v.toFixed(def.dp===0 ? 0 : (Math.abs(hi-lo)<5?2:0)), PADL-6, y+4); }
    ctx.textAlign='center';
    for(const tk of clip.ticks){ ctx.strokeStyle = css('--line'); ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(X(tk),4); ctx.lineTo(X(tk),ph+4); ctx.stroke(); ctx.globalAlpha=1;
      if(axisH) ctx.fillText(hm(tk), X(tk), h-3); }
    ctx.textAlign='left';
    if(ci===0){ ctx.fillStyle = col; ctx.font=`600 11px ${FONT}`; ctx.fillText('DETECTED', X(clip.ev_start)+6, 14); }
    if(band){ ctx.fillStyle='#ffffff12'; ctx.fillRect(PADL, Y(band), pw, Y(-band)-Y(band)); }
    const stroke = (arr, c, dash, lw) => {
      ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.setLineDash(dash); ctx.beginPath(); let pen=false;
      const stride = Math.max(1, Math.floor(arr.length/(pw*1.5)));
      for(let j=0;j<arr.length;j+=stride){ const v=arr[j]; if(v==null){pen=false;continue;} const x=X(j*clip.step),y=Y(v); pen?ctx.lineTo(x,y):ctx.moveTo(x,y); pen=true; }
      ctx.stroke(); ctx.setLineDash([]); };
    if(def.key){
      if(def.overlay) for(const id in clip.trk) stroke(clip.trk[id][def.overlay], TCOL[id], [3,3], 1.4);
      for(const l of lines){
        stroke(l.v, l.col, [], 1.6);
        const v = l.v[i]; if(v!=null){ ctx.fillStyle=l.col; ctx.beginPath(); ctx.arc(X(t),Y(v),4,0,7); ctx.fill(); }
      }
    } else {
      ctx.strokeStyle = css('--SPACE_WEATHER'); ctx.lineWidth=2; ctx.beginPath();
      clip.s4.forEach(([tt,v],j)=>{ j?ctx.lineTo(X(Math.max(0,tt)),Y(v)):ctx.moveTo(X(Math.max(0,tt)),Y(v)); }); ctx.stroke();
      ctx.fillStyle = css('--mute'); ctx.font=`10.5px ${FONT}`;
      clip.adv.concat(clip.rfi.map(r=>({t:r.t,type:'RFI'}))).forEach(a=>{ if(a.t>=0&&a.t<=clip.len){ctx.fillRect(X(a.t)-1,ph-8,2,12); ctx.fillText(a.type==='RFI'?'RFI':'ADV',X(a.t)+4,ph+1);} });
    }
    // playhead
    ctx.strokeStyle = css('--text'); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(X(t),0); ctx.lineTo(X(t),ph+4); ctx.stroke();
    // live values in the header, one per tractor, in tractor colors
    if(def.key){
      if(!vals.children.length) vals.innerHTML = lines.map(l=>`<span style="color:${l.col}"></span>`).join('');
      lines.forEach((l,n)=>{ const v = l.v[i], o = def.overlay ? clip.trk[l.id][def.overlay][i] : null;
        vals.children[n].textContent = `${l.id} ${v==null?'–':v.toFixed(def.dp)}` + (def.overlay ? ` / ${o==null?'–':o.toFixed(def.dp)}` : ''); });
    } else { const s4 = step_at(clip.s4, t); vals.textContent = s4==null ? '' : `S4 ${s4.toFixed(2)}`; vals.style.color = css('--SPACE_WEATHER'); }
  });
}

// ---------- card ----------
function fmt(sec){ const d = new Date(new Date(clip.t0).getTime() + sec*1000); return d.toISOString().slice(11,19)+'Z'; }
function step_at(arr, tt){ let v=null; for(const [a,b] of arr){ if(a<=tt) v=b; else break; } return v; }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function renderCard(){
  const c = clip, col = css('--'+c.cls), secs = Math.round(c.ev_end-c.ev_start), dur = secs < 120 ? secs+' s' : Math.round(secs/60)+' min';
  const conf = c.confidence==null ? '<span class="dim">dev label, no confidence</span>'
     : `<span class="bar"><i style="width:${c.confidence*100}%"></i></span><span class="pct">${(c.confidence*100).toFixed(0)}%</span>`;
  const ev = c.evidence.length ? `<ul>${c.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>` : '<p class="dim" style="margin:6px 0 0">None in this source (dev labels carry no evidence text).</p>';
  const el = $('card');
  el.innerHTML = `
    <div class="ctop"><span class="cls"><i></i>${c.cls.replace('_',' ')}</span><span class="cid">${c.id}</span></div>
    <div class="meta">${c.tractors.map(t=>`<span class="tch" style="color:${TCOL[t]}">${t}</span>`).join('')}<span class="when">${fmt(c.ev_start)} – ${fmt(c.ev_end)}</span><span>${dur}</span></div>
    <div class="action"><span class="lbl">Recommended action</span><b>${c.action.replace(/_/g,' ')}</b></div>
    <div class="conf"><span class="lbl">Confidence</span>${conf}</div>
    <div class="evid"><span class="lbl">Evidence</span>${ev}</div>
    <div class="space"><span>Space-side now</span><span class="v" id="sda"></span></div>`;
  el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh');
  el.scrollTop = 0;
}
function updateLive(){
  const on = inEvent(); $('clock').classList.toggle('on', on);
  $('clocktxt').textContent = fmt(t) + (on ? '  in event' : '');
  const s4 = step_at(clip.s4, t), kp = step_at(clip.kp, t);
  const el = $('sda'); if(el) el.textContent = `S4 ${s4==null?'–':s4.toFixed(2)}   Kp ${kp==null?'–':kp.toFixed(1)}` +
     clip.rfi.filter(r=>r.t<=t).map(r=>`   RFI report @${fmt(r.t)}`).join('');
  const p = Math.round(t/clip.len*1000); $('seek').value = p; $('seek').style.setProperty('--p', (p/10)+'%');
}

// ---------- loop & controls ----------
function frame(now){
  if(clip){
    const dt = Math.min(0.1, (now-last)/1000); last = now;
    if(playing){ t += dt * +$('speed').value; if(t>=clip.len){ t = clip.len; playing=false; $('play').innerHTML = ICON_AGAIN; } }
    drawField(); drawCharts(); updateTractorRows(); updateLive();
  }
  requestAnimationFrame(frame);
}
$('play').onclick = () => { if(t>=clip.len) t=0; playing = !playing; $('play').innerHTML = playing?ICON_PAUSE:ICON_PLAY; };
$('seek').oninput = e => seekFrac(e.target.value/1000);
$('mode').onclick = e => { const m = e.target.dataset.m; if(!m) return; mode = m; [...$('mode').children].forEach(b=>b.classList.toggle('on', b.dataset.m===m)); };
document.addEventListener('keydown', e=>{
  if(!clip || e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); $('play').click(); }
  if(e.key==='ArrowRight') t = Math.min(clip.len, t+30);
  if(e.key==='ArrowLeft') t = Math.max(0, t-30);
  if(e.key==='r') $('mode').children[mode==='raw'?1:0].click();
  const n = +e.key; if(n>=1 && n<=B.clips.length) select(n-1);
});
function wireFile(){
  $('file').onchange = async e => { B = JSON.parse(await e.target.files[0].text()); location.hash=''; init(); };
}
wireFile(); init(); requestAnimationFrame(t0=>{ last=t0; frame(t0); });
</script>
</body>
