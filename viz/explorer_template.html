<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Straight Rows Data Explorer</title>
<style>
/*__FONTS__*/
  /* Survey sheet on paper (docs/explorer-redesign/SPEC.md): warm paper ground, ink text, hairline rules instead of boxes,
     one magenta accent (--leg) used only as a line. Serif = names and headings, sans = text, mono = every measured value.
     Light theme only (projector-safe). Classes are told apart by fill pattern as well as hue. */
  :root{
    color-scheme:light;
    --paper:#f8f7f3; --paper-2:#f1efe9; --paper-3:#efece4;
    --ink:#17181b; --graphite:#44464c; --muted:#62646a;
    --rule:#dddad2; --rule-2:#e9e6df; --rule-3:#c4c0b4; --grid:#e4e1d8; --grid-v:#ece9e1;
    --leg:#a8326e; --bad:#b3261e;
    --t1:#2457a6; --t2:#c4621a; --t3:#1f7a4d;           /* tractor lines and markers */
    --t1t:#2457a6; --t2t:#a84e10; --t3t:#1f7a4d;         /* tractor colours where they are TEXT (T2 darkened for 4.5:1) */
    --SPACE_WEATHER:#d99a00; --JAMMING:#c2362b; --SPOOFING:#5846c4; --EQUIPMENT_FAULT:#b8457a; --MULTIPATH:#5d6f7a;
    --ui:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
    --serif:Newsreader,Georgia,serif;
    --data:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  ::selection{background:var(--ink);color:var(--paper)}
  html{scrollbar-color:var(--rule-3) transparent;scrollbar-width:thin}
  ::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--rule-3);border-radius:5px;border:2px solid var(--paper)} ::-webkit-scrollbar-track{background:transparent}
  body{margin:0;background:var(--paper);color:var(--graphite);font:14px/1.45 var(--ui);height:100vh;display:flex;flex-direction:column;
       font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  button,select,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--leg);outline-offset:2px;border-radius:1px}
  .muted{color:var(--muted)} .mono{font-family:var(--data)}
  h2{margin:0;font:500 19px/1.2 var(--serif);color:var(--ink)}
  h3{margin:0;font-size:13.5px;font-weight:700;color:var(--ink)}
  .lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}

  /* class swatch: pattern is the primary cue, hue the second (SPEC section 3) */
  .k{display:inline-block;width:10px;height:10px;flex:none;border:1px solid rgba(23,24,27,.35)}
  .k.SPACE_WEATHER{background:#d99a00}
  .k.JAMMING{background:repeating-linear-gradient(45deg,#c2362b 0 2px,#f0b9b4 2px 4px)}
  .k.SPOOFING{background:repeating-linear-gradient(90deg,#5846c4 0 2px,#cbc4f0 2px 4px)}
  .k.EQUIPMENT_FAULT{background:radial-gradient(#b8457a 1.2px,#f2cddc 1.3px) 0 0/4px 4px}
  .k.MULTIPATH{background:repeating-linear-gradient(90deg,#5d6f7a 0 1px,#e1e6e9 1px 3px)}
  .k.ALL{background:var(--ink)}


  /* controls */
  .seg{display:inline-flex;border:1px solid var(--rule-3);border-radius:2px;overflow:hidden;flex:none}
  .seg button{background:none;border:0;padding:5px 8px;font-size:13px;color:var(--graphite);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
  .seg button+button{border-left:1px solid var(--rule)}
  .seg button:hover{background:var(--paper-2)} .seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
  .seg button.mono{font-family:var(--data);font-size:12.5px;padding:5px 4px}
  .seg button:disabled{opacity:.45;cursor:default} .seg button:disabled:hover{background:none}
  .seg.full{display:flex} .seg.full button{flex:1}
  .btn{background:none;border:1px solid var(--rule-3);border-radius:2px;padding:5px 11px;font-size:13px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--ink);background:var(--paper-2)}
  .btn:disabled{opacity:.45;cursor:default} .btn:disabled:hover{border-color:var(--rule-3);background:none}
  .btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600} .btn.pri:hover{background:#2c2e33}
  .btn.sm{padding:2px 9px;font-size:13px}
  select{background:var(--paper);border:1px solid var(--rule-3);border-radius:2px;padding:3px 6px;cursor:pointer;font-size:13px}
  input[type=checkbox]{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin:0;border:1.5px solid currentColor;border-radius:0;background:transparent;cursor:pointer;flex:none;color:inherit}
  input[type=checkbox]:checked{background:currentColor;box-shadow:inset 0 0 0 2.5px var(--paper)}

  main{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw,288px) minmax(0,1fr) var(--rw,392px)}
  body.focus main{grid-template-columns:var(--lw,272px) minmax(0,1fr) var(--rw,440px)}
  .side{display:flex;flex-direction:column;min-height:0;min-width:0}
  .charts{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px 0;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
  .mid{display:flex;flex-direction:column;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:18px 20px 0}

  /* drag handles on the two column borders (wide layout only) */
  .grip{position:absolute;top:0;bottom:0;width:9px;z-index:6;cursor:col-resize;touch-action:none}
  .grip::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:transparent;transition:background .15s}
  .grip:hover::after,.grip.drag::after,.grip:focus-visible::after{background:var(--ink);width:2px;left:3.5px}
  .grip.l{left:-5px} .grip.r{right:-5px}
  body.resizing{cursor:col-resize;user-select:none}
  /* left rail: detections */
  .sidetop{padding:18px 20px 0;display:flex;flex-direction:column;gap:14px;flex:none}
  .phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .tabs{display:flex;gap:2px 14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--rule)}
  .tab{display:flex;align-items:center;gap:7px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:3px 0 4px;cursor:pointer;font-size:14px;transition:color .15s,border-color .15s}
  .tab:hover{color:var(--ink)} .tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
  .tab .n{font-family:var(--data);font-size:12.5px;color:var(--muted);font-weight:400}
  .srcrow{display:flex;align-items:center;gap:10px;padding-bottom:12px}
  /* Dev check: our dev detections scored against the labels */
  .st{font:600 11.5px var(--data);padding:0 6px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
  .st.ok{color:var(--t3t)} .st.bad{color:var(--bad)}
  .jmp{border:0;background:none;padding:0;font:inherit;color:var(--leg);text-decoration:underline;cursor:pointer}
  .cmpcard{margin:10px 0 14px;padding-top:8px;border-top:1px solid var(--rule-2)} .cmpcard p{margin:4px 0 0;line-height:1.5}
  #evlist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;border-top:1px solid var(--ink)}
  .ev{--c:var(--muted);display:grid;grid-template-columns:14px 1fr auto;grid-template-areas:"mk cl id" ". l2 l2";gap:2px 10px;align-items:baseline;width:100%;padding:9px 20px;border:0;border-top:1px solid var(--rule-2);background:none;color:var(--ink);text-align:left;cursor:pointer;transition:background .15s;flex:none}
  .ev:first-child{border-top:0}
  .ev:hover{background:var(--paper-2)} .ev.on{background:var(--paper-3);box-shadow:inset 0 0 0 1px var(--ink)}
  .ev .mk{grid-area:mk;align-self:center}
  .ev .cl{grid-area:cl;font:500 17px/1.2 var(--serif)}
  .ev .id{grid-area:id;font:12.5px var(--data);color:var(--muted)}
  .ev .l2{grid-area:l2;display:flex;justify-content:space-between;gap:10px;font:12.5px var(--data);color:var(--graphite)}
  .ev .tch{display:flex;gap:7px}
  .ev .tm{white-space:nowrap}
  .ev.grp{grid-template-areas:"mk cl id" ". note note";background:var(--paper-2)}
  .ev.grp .note{grid-area:note;color:var(--muted);font-size:13px;line-height:1.4}
  .ev.grp .id{display:flex;align-items:center;gap:6px;color:var(--graphite)}
  .ev.grp .chev{width:10px;height:10px}
  .ev.sub{padding-left:30px;background:var(--paper)} .ev.sub:hover{background:var(--paper-2)} .ev.sub.on{background:var(--paper-3)}
  .empty{padding:14px 20px;color:var(--muted);font-size:13.5px;line-height:1.5}

  /* toolbar */
  #nav{display:flex;flex-direction:column;flex:none}
  #navrowA{display:flex;flex-wrap:wrap;align-items:center;gap:10px 8px;padding-bottom:12px}
  #navrowA .grp{display:flex;align-items:center;gap:8px}
  #navrow2{padding:10px 0 12px;border-top:1px solid var(--rule-2)}
  #tools{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap}
  #tfilt{display:flex;gap:14px;align-items:center}
  #tfilt label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--data);font-size:13px;font-weight:500}
  .vals-grp{display:flex;align-items:center;gap:8px}
  body:not(.focus) #allSig{display:none}
  .menu{position:relative;margin-left:auto} .menu summary{list-style:none;display:inline-block} .menu summary::-webkit-details-marker{display:none}
  .menu summary::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);margin-left:9px}
  .menu[open] summary{border-color:var(--ink);background:var(--paper-2)}
  .menupanel{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:284px;max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--rule-3);padding:12px 14px;box-shadow:0 10px 24px rgba(23,24,27,.14),0 2px 5px rgba(23,24,27,.08);display:flex;flex-direction:column;gap:12px}
  .menupanel .group{display:flex;flex-direction:column;gap:5px}
  .gl{font-size:12.5px;font-weight:600;color:var(--muted)}
  .chk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;line-height:1.3;padding:2px 0;color:var(--ink)}
  .chk .u{color:var(--muted);font-family:var(--data);font-size:12.5px;margin-left:auto}

  /* overview */
  #ovp{border-top:1px solid var(--ink);padding:12px 0 6px;flex:none}
  #ovp .phead{justify-content:flex-start;align-items:baseline;gap:6px 14px;margin-bottom:4px;flex-wrap:wrap}
  #ovp h2{font-size:17px;flex:none}
  #range{flex:1;min-width:0;display:flex;gap:0 12px;flex-wrap:wrap;align-items:baseline;font:12.5px var(--data);color:var(--muted)}
  #ov{display:block;width:100%;touch-action:none;cursor:crosshair;user-select:none}

  /* stage: one continuous sheet */
  #stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;border-top:1px solid var(--ink);margin-top:2px}
  #stack{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
  #inner{position:relative;min-height:100%}
  #head{position:sticky;top:0;z-index:3;background:var(--paper);cursor:crosshair}
  #head canvas{display:block;width:100%}
  #xtag{position:absolute;top:2px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:12.5px var(--data);padding:1px 6px;border-radius:2px;pointer-events:none;white-space:nowrap;display:none;z-index:4}
  #xh{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--ink);pointer-events:none;display:none;z-index:2}
  #xh.pinned{border-left-style:dashed}
  body.focus #xh.pinned{border-left:1.4px solid var(--ink)}
  .ch{display:flex;flex-direction:column;border-top:1px solid var(--rule-2);padding:7px 0 4px;cursor:crosshair}
  .ch-head{display:flex;align-items:baseline;gap:10px;padding:0 0 2px 4px;white-space:nowrap}
  .ch-head .u,.ch-head .rng{color:var(--muted);font:12.5px var(--data);min-width:0;overflow:hidden;text-overflow:ellipsis}
  .ch-head .rng{margin-left:auto}
  .ch canvas{display:block;width:100%;height:140px}
  .ch.sda canvas{height:52px}
  #sdaWrap .ch:first-child{border-top:1px solid var(--ink);margin-top:2px}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--graphite);background:var(--paper);z-index:5}
  #msg.show{display:flex} #msg p{margin:0;max-width:46ch;line-height:1.5} #msg b{color:var(--ink);font-weight:700}
  #msg .bar{width:180px;height:4px;background:var(--rule);overflow:hidden;margin:12px auto 0} #msg .bar i{display:block;height:100%;width:40%;background:var(--ink);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

  /* focus bar */
  #focusbar{display:none} body.focus #focusbar{display:block} body.focus #nav,body.focus #ovp{display:none}
  .fb1,.fb2,.fb3{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
  #nav>.fb2{margin:0 0 12px;padding:0;border:0}
  .fb2,.fb3{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule-2)}
  .fbt{display:flex;align-items:center;gap:10px;min-width:0}
  .fbt .nm{font:500 22px/1.15 var(--serif);color:var(--ink)}
  .fbt .k{width:12px;height:12px}
  .fbt .mono{font-size:12.5px;color:var(--muted)}
  button.play{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:2px;padding:6px 14px 6px 11px;font-weight:600;cursor:pointer;min-width:100px;transition:background .15s}
  button.play:hover{background:#2c2e33} button.play svg{width:15px;height:15px;fill:currentColor}
  #seek{flex:1;min-width:140px;-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer;margin:0}
  #seek::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--ink) var(--p,0%),var(--rule) var(--p,0%))}
  #seek::-moz-range-track{height:4px;background:var(--rule)} #seek::-moz-range-progress{height:4px;background:var(--ink)}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
  #seek::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
  #fclock{font:13px var(--data);color:var(--ink)}
  .fb3 #tools{width:100%}

  /* right rail: field map */
  .fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding-bottom:10px;flex:none;white-space:nowrap}
  .fhead .sub{order:3;flex-basis:100%;font-size:13px;color:var(--muted)}
  #clock{margin-left:auto;font:12.5px var(--data);color:var(--ink);display:flex;align-items:center;gap:8px}
  #clock .live{width:8px;height:8px;border-radius:50%;background:var(--rule-3)} #clock.on .live{background:var(--c,var(--ink));animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  #fieldbody{position:relative;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);flex:none}
  #field{display:block;width:100%;height:clamp(320px,50vh,580px)} body.focus #field{height:clamp(260px,34vh,400px)}
  #field.zoomed{cursor:grab} #field.pan{cursor:grabbing}
  #ffull{position:absolute;right:0;top:6px;z-index:2;background:var(--paper);width:30px;height:26px;padding:0;display:flex;align-items:center;justify-content:center}
  #fieldwrap{background:var(--paper)} #fieldwrap:fullscreen{display:flex;flex-direction:column;padding:16px 24px}
  #fieldwrap:fullscreen #fieldbody{flex:1;min-height:0} #fieldwrap:fullscreen #field{height:100%}
  #fzoom{position:absolute;left:0;top:6px;display:flex;flex-direction:column;gap:3px;z-index:2} #fzoom .btn{background:var(--paper);min-width:30px}
  #tstat{display:flex;flex-direction:column;flex:none}
  .tr{--c:var(--ink);display:grid;grid-template-columns:1fr auto;grid-template-areas:"id cn0" "sf xte";gap:1px 10px;padding:8px 6px;border-top:1px solid var(--rule-2);font:12.5px var(--data);color:var(--muted)}
  .tr:first-child{border-top:0}
  .tr>:nth-child(1){grid-area:id} .tr>:nth-child(2){grid-area:cn0;color:var(--ink);font-size:14.5px;font-weight:500;text-align:right}
  .tr>:nth-child(3){grid-area:sf} .tr>:nth-child(4){grid-area:xte;text-align:right}
  .tr.hit{background:color-mix(in srgb,var(--c) 11%,transparent);color:var(--graphite)}
  .tr b{font-family:var(--ui);font-weight:700;font-size:14.5px}
  .tr .warn{color:var(--bad);font-weight:600}
  .chip{display:inline-block;padding:0 6px;border-radius:2px;font-family:var(--ui);font-size:12px;font-weight:700;background:var(--bad);color:#fff;margin:0 6px;letter-spacing:.02em}

  /* right rail: readout and detection card */
  #cardp{flex:1;display:flex;flex-direction:column;min-height:300px;padding-top:14px}
  #rtabs{display:none;padding-bottom:12px} body.focus #rtabs{display:block} #rtabs .seg{width:100%} #rtabs .seg button{flex:1}
  #card{display:none;overflow:hidden;flex-direction:column;gap:12px;flex:1;min-height:0}
  #card>*{flex-shrink:0}
  #card>.evid{flex:1 1 auto;min-height:140px;overflow-y:auto;padding-right:4px}
  #readout{overflow-y:auto;flex:1;min-height:0;padding-bottom:16px;padding-right:14px;scrollbar-gutter:stable}   /* keep the right-aligned T3 column clear of an overlay scrollbar */
  body.focus #cardp[data-tab=detection] #card{display:flex} body.focus #cardp[data-tab=detection] #readout{display:none}
  .rh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;white-space:nowrap}
  .rh h2{font-size:17px}
  .rh .t{font:12.5px var(--data);color:var(--muted);margin-left:auto}
  table.vals{width:100%;border-collapse:collapse;font-size:13.5px}
  table.vals th{font:600 12.5px var(--data);text-align:right;padding:2px 0 6px}
  table.vals td{padding:5px 0 5px 8px;border-top:1px solid var(--rule-2);font:13px var(--data);text-align:right;white-space:nowrap;color:var(--ink)}
  table.vals td:first-child,table.vals th:first-child{text-align:left;font-family:var(--ui);color:var(--graphite);font-size:13.5px;padding-left:0}
  table.vals .off{opacity:.38}
  table.vals td.warn{color:var(--bad);font-weight:600}
  .sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
  .sec h3{margin-bottom:4px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
  .kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){font-family:var(--data);text-align:right;color:var(--ink)}
  .sda-note{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--graphite)}
  .sda-note b{color:var(--ink);font-family:var(--data);font-weight:600}
  .evc{padding:9px 0;border-top:1px solid var(--rule-2)} .evc:first-of-type{border-top:0}
  .evc .top{display:flex;align-items:center;gap:8px}
  .evc .cl{font:500 17px/1.2 var(--serif);color:var(--ink)}
  .evc .id{margin-left:auto;font:12.5px var(--data);color:var(--muted)}
  .evc .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .evc .sub .mono{color:var(--ink)}
  .evc details{margin-top:6px} .evc summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
  .evc ul{margin:5px 0 0;padding-left:16px;font-size:13px;line-height:1.45} .evc li{margin-bottom:4px}
  .tagsrc{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--rule-3);border-radius:2px;padding:0 4px;color:var(--muted)}
  .ctop{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cls{display:flex;align-items:center;gap:10px;font:500 24px/1.1 var(--serif);color:var(--ink);letter-spacing:-.005em}
  .cls .k{width:12px;height:12px}
  .cid{font:12.5px var(--data);color:var(--muted)}
  .meta{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .tch{font:600 13.5px var(--data)}
  .when{font-family:var(--data);color:var(--ink);font-size:13px}
  .verdict{display:flex;flex-direction:column;gap:10px;padding:10px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
  .verdict .lbl,.evid .lbl{display:block;margin-bottom:3px}
  .verdict b{display:block;font-size:16px;font-weight:700;letter-spacing:.05em;color:var(--ink)}
  .conf{display:flex;align-items:center;gap:12px}
  .conf .lbl{margin:0;min-width:78px}
  .cbar{flex:1;max-width:200px;height:6px;background:var(--rule)}

<body>

<script>
"use strict";
const B = /*__BUNDLE__*/null;
const BLOB = "/*__BLOB__*/";

/* ---------- constants & state ---------- */
const N = B.n, T0MS = Date.parse(B.t0), MISS = B.missing, DEV_END = B.dev_end;
const PL = 62, PR = 14;                       // plot gutters, shared by every canvas so time lines up vertically
const TRS = B.tractors;
const CLASSES = ["SPACE_WEATHER","JAMMING","SPOOFING","EQUIPMENT_FAULT","MULTIPATH"];
const CNAME = {SPACE_WEATHER:"Space weather",JAMMING:"Jamming",SPOOFING:"Spoofing",EQUIPMENT_FAULT:"Equipment fault",MULTIPATH:"Multipath"};
const css = getComputedStyle(document.documentElement);
const col = n => css.getPropertyValue(n).trim();
const C = {ink:col("--ink"),graphite:col("--graphite"),muted:col("--muted"),grid:col("--grid"),gridv:col("--grid-v"),rule:col("--rule"),rule2:col("--rule-2"),rule3:col("--rule-3"),
           paper:col("--paper"),paper2:col("--paper-2"),leg:col("--leg"),bad:col("--bad"),data:col("--data"),ui:col("--ui")};
const TCOL = Object.fromEntries(TRS.map((t,i)=>[t,col("--t"+(i+1))]));       // lines and markers
const TTXT = Object.fromEntries(TRS.map((t,i)=>[t,col("--t"+(i+1)+"t")]));   // the same hues where they are text
const CCOL = Object.fromEntries(CLASSES.map(c=>[c,col("--"+c)]));
const CDK = {SPACE_WEATHER:"#8a5d00",JAMMING:"#b3261e",SPOOFING:"#4b3bb8",EQUIPMENT_FAULT:"#a03a66",MULTIPATH:"#5d6f7a"};   // stroke / text versions of the class colours
const CLT = {JAMMING:"#f0b9b4",SPOOFING:"#cbc4f0",EQUIPMENT_FAULT:"#f2cddc",MULTIPATH:"#e1e6e9"};                           // light ground behind each pattern
// Canvas cannot use CSS gradients, so the class fills are tiles from a small offscreen canvas (same stripe / dot geometry as the swatches).
const PAT = {};
function pattern(ctx,key){
  const dpr=window.devicePixelRatio||1, ck=key+"@"+dpr; if(PAT[ck]) return PAT[ck];
  const sz=key==="PARKED"?7:6, cv=document.createElement("canvas"); cv.width=Math.round(sz*dpr); cv.height=Math.round(sz*dpr);
  const g=cv.getContext("2d"); g.scale(dpr,dpr);
  if(key==="JAMMING"){ g.fillStyle=CLT.JAMMING; g.fillRect(0,0,6,6); g.strokeStyle=CCOL.JAMMING; g.lineWidth=2.1; g.beginPath(); for(const o of [0,-6,6]){ g.moveTo(o,6); g.lineTo(o+6,0); } g.stroke(); }   // 45 deg stripes
  else if(key==="SPOOFING"){ g.fillStyle=CLT.SPOOFING; g.fillRect(0,0,6,6); g.fillStyle=CCOL.SPOOFING; g.fillRect(0,0,3,6); }                                                      // vertical stripes
  else if(key==="EQUIPMENT_FAULT"){ g.fillStyle=CLT.EQUIPMENT_FAULT; g.fillRect(0,0,6,6); g.fillStyle=CCOL.EQUIPMENT_FAULT; g.beginPath(); g.arc(3,3,1.7,0,7); g.fill(); }        // dots
  else if(key==="MULTIPATH"){ g.fillStyle=CLT.MULTIPATH; g.fillRect(0,0,6,6); g.fillStyle=CCOL.MULTIPATH; g.fillRect(0,0,1,6); g.fillRect(3,0,1,6); }                               // thin vertical ticks
  else if(key==="PARKED"){ g.strokeStyle="#dad6cb"; g.lineWidth=1; g.beginPath(); g.moveTo(0,0); g.lineTo(7,7); g.stroke(); }                                                      // 135 deg hairlines
  else return null;
  const p=ctx.createPattern(cv,"repeat"); p.setTransform(new DOMMatrix().scale(1/dpr)); return PAT[ck]=p;
}
const classFill = (ctx,cls) => pattern(ctx,cls) || CCOL[cls];

// chart catalogue. dom = fixed y-domain, minSpan = smallest auto range, zero = keep 0 in view, step = draw as stairs
const SIG = {
  cn0:    {title:"Mean C/N0", unit:"dB-Hz", minSpan:2, dec:1},
  mincn0: {title:"Weakest satellite C/N0", short:"Min C/N0", unit:"dB-Hz", minSpan:2, dec:1},
  xte:    {title:"Cross-track error", unit:"m", minSpan:0.05, zero:true, dec:3},
  sats:   {title:"Satellites used", unit:"", dom:[0,14], dec:0},
  fix:    {title:"Fix state", unit:"", dom:[-0.3,4.5], step:true, dec:0},
  link:   {title:"Base link", unit:"", dom:[-0.15,1.15], step:true, dec:0},
  speed:  {title:"Speed", unit:"m/s", minSpan:1, zero:true, dec:1},
  londev: {title:"Position offset vs XTE", short:"Offset vs XTE", unit:"m", minSpan:0.5, zero:true, dec:2, overlay:"xte", note:"solid offset, dashed XTE"},
};
const ORDER = ["cn0","mincn0","xte","londev","sats","fix","link","speed"];
const RES = {cn0:"mean_cn0_dbhz", xte:"axte", sats:"num_sats"};   // signals that have own / fleet residual views (key into bundle baseline & sigma)
const S = {
  filter:"ALL", v0:0, v1:N, tr:Object.fromEntries(TRS.map(t=>[t,true])),
  sig:{cn0:true,mincn0:false,xte:true,londev:false,sats:true,fix:true,link:false,speed:false}, mode:"raw",
  sda:{kp:true,dst:true,s4:true,ev:true},
  layers:"detections", cls:Object.fromEntries(CLASSES.map(c=>[c,true])),
  fixedY:false, parked:true, ovSig:"cn0", pin:null, cur:null, sel:null,
};

let F=null;   // focus state while one event is open: {ev,w0,w1,t,playing,speed,all,saved}

/* ---------- decode ---------- */
const D = {}, GR = {};      // D[tractor][signal] = {a:Int16Array, k:1/scale};  GR[signal] = [min,max] over everything
async function inflate(b64){
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const buf = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return new Int16Array(buf);
}
function unpack(all){
  const ns = B.signals.length;
  TRS.forEach((t,ti)=>{ D[t] = {};
    B.signals.forEach((s,si)=>{ const off=(ti*ns+si)*N; D[t][s.key] = {a:all.subarray(off,off+N), k:1/s.scale}; }); });
  for(const key of ORDER.filter(k=>k!=="londev")){ let lo=Infinity, hi=-Infinity;
    for(const t of TRS){ const {a,k}=D[t][key]; for(let i=0;i<N;i+=7){ const v=a[i]; if(v===MISS) continue; if(v<lo)lo=v; if(v>hi)hi=v; } }
    GR[key]=[lo*D[TRS[0]][key].k, hi*D[TRS[0]][key].k]; }
}

/* ---------- residual views ---------- */
// Same definitions as the replay viewer. own = signal minus that tractor's median over working seconds;
// fleet = signal minus the median of the tractors at the same second. XTE residuals use |XTE|.
// Stored as Int16 with the signal's own scale so every drawing routine can treat them like raw data.
const RCACHE = {};
function resid(mode,t,key){
  const ck=mode+key; if(!RCACHE[ck]){ const out={}, sc=Math.round(1/D[TRS[0]][key].k), ab=key==="xte", lim=32767;
    for(const tr of TRS) out[tr]={a:new Int16Array(N),k:D[tr][key].k};
    if(mode==="own"){ for(const tr of TRS){ const base=Math.round(B.baseline[tr][RES[key]]*sc), src=D[tr][key].a, o=out[tr].a;
        for(let i=0;i<N;i++){ const v=src[i]; o[i]=v===MISS?MISS:clamp((ab?Math.abs(v):v)-base,-lim,lim); } } }
    else { const v=new Array(TRS.length);
      for(let i=0;i<N;i++){ let ok=true; for(let j=0;j<TRS.length;j++){ const x=D[TRS[j]][key].a[i]; if(x===MISS){ok=false;break;} v[j]=ab?Math.abs(x):x; }
        if(!ok){ for(const tr of TRS) out[tr].a[i]=MISS; continue; }
        const sorted=[...v].sort((a,b)=>a-b), m=sorted.length%2?sorted[sorted.length>>1]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
        for(let j=0;j<TRS.length;j++) out[TRS[j]].a[i]=clamp(Math.round(v[j]-m),-lim,lim); } }
    RCACHE[ck]=out; }
  return RCACHE[ck][t];
}
const resMode = key => S.mode!=="raw" && RES[key] ? S.mode : null;
const seriesFor = (t,key) => resMode(key) ? resid(S.mode,t,key) : D[t][key];

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const pad2 = n => String(n).padStart(2,"0");
const iso = s => new Date(T0MS + s*1000).toISOString();
const fmtT = (s,sec=true) => iso(s).slice(0,10)+" "+iso(s).slice(11, sec?19:16);
function fmtDur(s){ if(s<60) return (s<10?s.toFixed(1):Math.round(s))+" s"; if(s<3600) return +(s/60).toFixed(1)+" min"; if(s<172800) return +(s/3600).toFixed(1)+" h"; return +(s/86400).toFixed(1)+" d"; }
function el(tag, attrs={}, ...kids){ const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k==="html") e.innerHTML=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const c of kids) e.append(c); return e; }
function fit(cv, h){ // size a canvas for the device pixel ratio; returns a CSS-pixel context
  if(h!=null) cv.style.height=h+"px";
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  const w=Math.max(1,Math.round(r.width)), hh=Math.max(1,Math.round(r.height));
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(hh*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(hh*dpr); }
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx,w,h:hh};
}
function niceTicks(lo,hi,n){ const span=hi-lo; if(!(span>0)) return [lo]; const raw=span/n, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p;
  const step=(m<1.5?1:m<3?2:m<7?5:10)*p, out=[]; for(let v=Math.ceil(lo/step-1e-9)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(10)); out.step=step; return out; }
const TSTEPS=[1,2,5,10,15,30,60,120,300,600,900,1800,3600,7200,10800,21600,43200,86400];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function timeTicks(v0,v1,PW){ const want=Math.max(2,PW/92); let step=TSTEPS.find(s=>(v1-v0)/s<=want)||86400;

          cand=EV.filter(x=>x.src===box.ln&&evVisible(x)&&(box.row==="tick"?isTick(x):!isTick(x)&&(rowOf[x.id]||0)===box.row)&&x.t0-tol<=t&&t<=x.t1+tol).sort((a,b)=>(a.t1-a.t0)-(b.t1-b.t0))[0];
        if(cand){ S.sel=cand.id; S.pin=t; schedule(); return; } } }
    if(G.playing){ G.t=t; S.pin=t; S.cur=t; schedule(); return; }   // while playing, a click seeks
    S.pin=S.pin==null?t:null; S.cur=t; schedule(); };
  st.addEventListener("pointerup",up); st.addEventListener("pointercancel",()=>{ drag=null; });
  st.addEventListener("wheel",e=>{ const t=timeAt(e); if(Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.shiftKey){ e.preventDefault(); setView(S.v0+(e.deltaX||e.deltaY)*(S.v1-S.v0)/2000,S.v1+(e.deltaX||e.deltaY)*(S.v1-S.v0)/2000); return; }
    if(t==null) return; e.preventDefault(); zoomAbout(t,Math.exp(e.deltaY*.0016)); },{passive:false});
})();

/* ---------- controls ---------- */
const INP={sig:{},sda:{}};
function chk(label,checked,onchange,unit){ const i=el("input",{type:"checkbox"}); i.checked=checked; i.onchange=()=>onchange(i.checked); return [i,el("label",{class:"chk"},i,label,unit?el("span",{class:"u"},unit):"")]; }
function buildControls(){
  // tractor filter + Signals menu (shared by the browse and focus toolbars)
  const tf=$("tfilt"); for(const t of TRS){ const i=el("input",{type:"checkbox",checked:""}); i.onchange=()=>{ S.tr[t]=i.checked; ovBase=null; buildStack(); updateField(); }; tf.append(el("label",{style:"color:"+TTXT[t]},i,t)); }
  const mb=$("menuBody"), grp=(title,rows)=>{ const g=el("div",{class:"group"},el("span",{class:"gl"},title)); for(const r of rows) g.append(r); return g; };
  mb.append(grp("Telemetry",ORDER.map(k=>{ const [i,l]=chk(SIG[k].short||SIG[k].title,S.sig[k],v=>{S.sig[k]=v; buildStack();},SIG[k].unit); INP.sig[k]=i; return l; })));
  mb.append(grp("Space weather",[["kp","Kp index"],["dst","Dst"],["s4","S4 scintillation"],["ev","RFI and advisories"]].map(([k,lab])=>{ const [i,l]=chk(lab,S.sda[k],v=>{S.sda[k]=v; buildStack();}); INP.sda[k]=i; return l; })));
  mb.append(grp("View",[chk("Fixed y-range (whole dataset)",S.fixedY,v=>{S.fixedY=v; schedule();})[1], chk("Shade parked time",S.parked,v=>{S.parked=v; schedule();})[1]]));
  // detections panel: sort, class tabs, source
  for(const b of $("layers").children) b.onclick=()=>{ S.layers=b.dataset.l; for(const x of $("layers").children) x.classList.toggle("on",x===b); ovBase=null; renderTabs(); schedule(); };
  renderTabs();
  $("ovSig").onchange=e=>{S.ovSig=e.target.value; ovBase=null; schedule();};
  const fc=$("field"), at=e=>{ const r=fc.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  fc.addEventListener("wheel",e=>{ e.preventDefault(); const [mx,my]=at(e); fieldZoom(Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0015)),mx,my); },{passive:false});
  let fdrag=null;
  fc.addEventListener("pointerdown",e=>{ if(FZ.z<=1) return; fdrag=[e.clientX,e.clientY]; fc.setPointerCapture(e.pointerId); fc.classList.add("pan"); });
  fc.addEventListener("pointermove",e=>{ if(!fdrag) return; FZ.px+=e.clientX-fdrag[0]; FZ.py+=e.clientY-fdrag[1]; fdrag=[e.clientX,e.clientY]; updateField(); });
  const fup=()=>{ fdrag=null; fc.classList.remove("pan"); }; fc.addEventListener("pointerup",fup); fc.addEventListener("pointercancel",fup);
  fc.addEventListener("dblclick",fieldFit);
  const fw=$("fieldwrap"), ff=$("ffull"), fsOn=()=>document.fullscreenElement===fw;
  const ICON_ON='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg>',
    ICON_OFF='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M5 1v4H1M13 5H9V1M9 13V9h4M1 9h4v4"/></svg>';
  const fsIcon=()=>{ const on=fsOn(); ff.innerHTML=on?ICON_OFF:ICON_ON; ff.title=ff.ariaLabel=on?"Exit full screen (Esc)":"Full screen"; }; fsIcon();
  if(!fw.requestFullscreen) ff.style.display="none";
  ff.onclick=()=>{ if(fsOn()) document.exitFullscreen(); else fw.requestFullscreen().catch(()=>{}); };
  document.addEventListener("fullscreenchange",()=>{ fsIcon(); setTimeout(updateField,30); });
  $("fzin").onclick=()=>fieldZoom(1.6); $("fzout").onclick=()=>fieldZoom(1/1.6); $("fzfit").onclick=fieldFit;
  $("play").innerHTML=PLAY; $("speed").value=spd.free;
  $("focusBtn").onclick=()=>{ const e=EV.find(x=>x.id===S.sel); if(e) enterFocus(e); };
  $("fbPrev").onclick=()=>stepEvent(-1); $("fbNext").onclick=()=>stepEvent(1); $("fbExit").onclick=exitFocus;
  $("play").onclick=()=>{ const P=PB(); if(P===F&&F.t>=F.w1-1) F.t=F.w0; setPlaying(!P.playing); };
  $("seek").oninput=e=>{ const P=PB(); setPlaying(false); P.t=P.w0+(+e.target.value/1000)*(P.w1-P.w0); S.pin=P.t; tickFocus(); };
  $("speed").onchange=e=>{ PB().speed=+e.target.value; spd[F?"focus":"free"]=e.target.value; };
  $("allSig").onclick=()=>{ if(!F) return; F.all=!F.all; applyKey(); };
  for(const seg of document.querySelectorAll("[data-modeseg]")) for(const b of seg.children) b.onclick=()=>setMode(b.dataset.m);
  for(const b of $("rtabs").firstElementChild.children) b.onclick=()=>setTab(b.dataset.tab);
  document.addEventListener("click",e=>{ const m=$("sigmenu"); if(m.open&&!m.contains(e.target)) m.open=false; });
}
/* ---------- resizable side rails ---------- */
(function rails(){
  const main=document.querySelector("main"), LIM={l:[200,520],r:[300,720]}, KEY="sr-rails";
  const set=(side,px)=>{ const [a,b]=LIM[side], otherW=document.querySelector(side==="l"?".mid":".side").getBoundingClientRect().width,
      room=main.getBoundingClientRect().width-otherW-380;   // keep at least 380 px for the charts
    px=Math.round(clamp(px,a,Math.max(a,Math.min(b,room)))); main.style.setProperty(side==="l"?"--lw":"--rw",px+"px"); ovBase=null; schedule(); return px; };
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify([main.style.getPropertyValue("--lw"),main.style.getPropertyValue("--rw")])); }catch(e){} };
  try{ const v=JSON.parse(localStorage.getItem(KEY)||"null"); if(v){ if(v[0]) main.style.setProperty("--lw",v[0]); if(v[1]) main.style.setProperty("--rw",v[1]); } }catch(e){}
  for(const [id,side] of [["gripL","l"],["gripR","r"]]){ const g=$(id); let drag=null;
    const cur=()=>side==="l"?document.querySelector(".side").getBoundingClientRect().width:document.querySelector(".mid").getBoundingClientRect().width;
    g.addEventListener("pointerdown",e=>{ g.setPointerCapture(e.pointerId); drag={x:e.clientX,w:cur()}; g.classList.add("drag"); document.body.classList.add("resizing"); e.preventDefault(); });
    g.addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x; set(side,drag.w+(side==="l"?dx:-dx)); updateField(); });
    const end=()=>{ if(!drag) return; drag=null; g.classList.remove("drag"); document.body.classList.remove("resizing"); save(); };
    g.addEventListener("pointerup",end); g.addEventListener("pointercancel",end);
    g.addEventListener("dblclick",()=>{ main.style.removeProperty(side==="l"?"--lw":"--rw"); ovBase=null; schedule(); updateField(); save(); });
    g.addEventListener("keydown",e=>{ if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return; const d=(e.key==="ArrowRight"?1:-1)*16*(side==="l"?1:-1); set(side,cur()+d); updateField(); save(); e.preventDefault(); e.stopPropagation(); });
  }
})();
/* ---------- detections list: class tabs, sort, grouped multipath ---------- */
let mpOpen=false;
const srcOk = e => S.layers==="both" || (S.layers==="labels"&&e.src==="label") || (S.layers==="detections"&&e.src==="detection");
function setFilter(k){ S.filter=k; for(const c of CLASSES) S.cls[c]=k==="ALL"||c===k; if(k==="MULTIPATH") mpOpen=true; ovBase=null; renderTabs(); schedule(); }
function renderTabs(){
  const box=$("tabs"); box.textContent=""; const all=EV.filter(srcOk).length;
  const opts=[["ALL","All",all,null],...CLASSES.map(c=>[c,CNAME[c],EV.filter(e=>srcOk(e)&&e.cls===c).length,c]).filter(o=>o[2]>0)];
  for(const [k,label,n,cls] of opts){ const b=el("button",{class:"tab"+(S.filter===k?" on":""),onclick:()=>setFilter(k)}); b.append(el("i",{class:"k "+(cls||"ALL")})); b.append(el("span",{class:"cl"},label),el("span",{class:"n"},n)); box.append(b); }
  if(S.filter!=="ALL"&&!opts.some(o=>o[0]===S.filter)){ S.filter="ALL"; for(const c of CLASSES) S.cls[c]=true; return renderTabs(); }
  const l=$("evlist"); if(l) l.dataset.k="";
}
let listKey="";
function renderList(){
  const box=$("evlist"); if(!box) return;
  const key=[S.sel,S.filter,S.layers,mpOpen,F?1:0].join("|"); if(key===listKey&&box.dataset.k!=="") return; listKey=key; box.dataset.k="x";
  const cmp=(a,b)=>a.t0-b.t0;   // always by start time
  const items=EV.filter(e=>srcOk(e)&&S.cls[e.cls]), main=items.filter(e=>e.cls!=="MULTIPATH").sort(cmp), mp=items.filter(e=>e.cls==="MULTIPATH").sort(cmp);
  const row=(e,cl)=>el("button",{class:"ev "+(cl||"")+(S.sel===e.id?" on":""),onclick:()=>enterFocus(e)},
      el("i",{class:"k mk "+e.cls}),el("span",{class:"cl"},CNAME[e.cls]),el("span",{class:"id"},e.id),
      el("span",{class:"l2"},el("span",{class:"tch",html:e.tractors.map(t=>'<span style="color:'+TTXT[t]+'">'+t+"</span>").join("")+(e.conf==null?"":'<span class="cf">'+Math.round(e.conf*100)+"%</span>")}),
        el("span",{class:"tm"},fmtT(e.t0,false).slice(5)+"Z")));
  const prev=box.scrollTop; box.textContent="";
  for(const e of main) box.append(row(e));
  if(mp.length){ const nl=mp.filter(e=>e.src==="label").length, nd=mp.length-nl;
    const chev='<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="'+(mpOpen?"M1.5 3.5 5 7l3.5-3.5":"M3.5 1.5 7 5 3.5 8.5")+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const g=el("button",{class:"ev grp","aria-expanded":String(mpOpen),onclick:()=>{ mpOpen=!mpOpen; renderList(); }},el("i",{class:"k mk MULTIPATH"}),el("span",{class:"cl"},"Multipath"),el("span",{class:"id",html:mp.length+chev}),
      el("span",{class:"note"},nl+" labelled, "+nd+" detected: one per tractor per headland pass. "+(mpOpen?"Collapse":"Expand")+" to list them."));
    box.append(g); if(mpOpen) for(const e of mp) box.append(row(e,"sub")); }
  if(!box.children.length) box.append(el("div",{class:"empty"},"No events match."));
  box.scrollTop=prev; const on=box.querySelector(".ev.on"); if(on) on.scrollIntoView({block:"nearest"});
}

addEventListener("keydown",e=>{
  const tg=e.target, tag=tg.tagName;
  if(/INPUT|SELECT|TEXTAREA/.test(tag)&&tg.type!=="checkbox") return; if(e.ctrlKey||e.metaKey||e.altKey) return; const span=S.v1-S.v0;
  const k=e.key; let used=true;
  if(k===" "&&/BUTTON|SUMMARY|INPUT/.test(tag)) return;   // Space belongs to the focused control (button, menu, checkbox)
  if(F){ if(k===" "){ if(F.t>=F.w1-1) F.t=F.w0; setPlaying(!F.playing); }
    else if(k==="ArrowLeft"||k==="ArrowRight"){ setPlaying(false); F.t=clamp(F.t+(k==="ArrowRight"?1:-1)*(e.shiftKey?300:30),F.w0,F.w1); tickFocus(); }
    else if(k==="r"||k==="R") setMode({raw:"own",own:"fleet",fleet:"raw"}[S.mode]); else if(k==="Escape") exitFocus();
    else if(k==="[") stepEvent(-1); else if(k==="]") stepEvent(1); else used=false;
    if(used) e.preventDefault(); if(!(k==="+"||k==="="||k==="-"||k==="_")) return; used=true; }
  if(k==="ArrowLeft") setView(S.v0-span*(e.shiftKey?.8:.2),S.v1-span*(e.shiftKey?.8:.2)); else if(k==="ArrowRight") setView(S.v0+span*(e.shiftKey?.8:.2),S.v1+span*(e.shiftKey?.8:.2));
  else if(k==="+"||k==="=") zoomAbout(S.pin!=null?S.pin:center(),.5); else if(k==="-"||k==="_") zoomAbout(S.pin!=null?S.pin:center(),2);
  else if(k==="0") setView(0,N); else if(k==="Escape"){ setPlaying(false); S.pin=null; S.sel=null; schedule(); } else if(k===" ") $("play").click(); else if(k==="[") stepEvent(-1); else if(k==="]") stepEvent(1); else used=false;
  if(used) e.preventDefault();
});
new ResizeObserver(()=>{ ovBase=null; schedule(); }).observe(document.body);
addEventListener("hashchange",()=>{ readHash(); schedule(); });

/* ---------- start ---------- */
(async function init(){
  try{ if(typeof DecompressionStream==="undefined") throw new Error("This browser has no DecompressionStream; use a current Chrome, Edge, Firefox or Safari.");
    unpack(await inflate(BLOB)); }
  catch(err){ $("msg").innerHTML='<div><p><b>Could not load the data.</b><br>'+String(err.message||err).replace(/</g,"&lt;")+'</p></div>'; return; }
  readHash(); fbAll=boundsFor(0,N-1,60); renderTractorRows(); buildControls(); buildReadout(); $("msg").classList.remove("show"); buildStack();
  const h=Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(p=>p.split("=")));   // #ev=<id>&t=<sec>&m=own&play=0
  if(h.m&&["own","fleet"].includes(h.m)) setMode(h.m);
  if(h.ev){ const e=EV.find(x=>x.id===h.ev); if(e){ enterFocus(e); if(h.t) F.t=clamp(+h.t,F.w0,F.w1); if(h.play==="0"||h.t) setPlaying(false); tickFocus(); } }
})();
